server:
  port: 9090

spring:
  application:
    name: keyfort-demo-site

  datasource:
    url: jdbc:h2:mem:demositedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

keyfort:
  connector:
    secret: ${KEYFORT_CONNECTOR_SECRET:}
    webhook-url: ${KEYFORT_CONNECTOR_WEBHOOK_URL:http://localhost:8080/api/webhooks/login}
