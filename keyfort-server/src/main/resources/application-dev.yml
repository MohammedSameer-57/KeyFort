spring:
  datasource:
    url: jdbc:h2:mem:keyfortdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

keyfort:
  jwt:
    secret: "dev-only-insecure-test-jwt-secret-material-must-be-at-least-256-bits-long!!"
