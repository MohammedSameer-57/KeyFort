server:
  port: 8080

spring:
  application:
    name: keyfort-server

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:keyfort}}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

keyfort:
  jwt:
    secret: ${KEYFORT_JWT_SECRET:}
    expiration-ms: 900000 # 15 minutes
  connector:
    secret: ${KEYFORT_CONNECTOR_SECRET:}
    base-url: ${KEYFORT_CONNECTOR_BASE_URL:http://localhost:9090}
  cors:
    allowed-origins: ${KEYFORT_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:9090,http://localhost:3000}
